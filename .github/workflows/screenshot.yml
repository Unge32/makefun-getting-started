name: Screenshot repo page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/screenshot.yml

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Capture full-page screenshot
        run: |
          cat > shot.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 }, deviceScaleFactor: 1 });
          await page.goto('https://github.com/Unge32/makefun-getting-started', { waitUntil: 'load', timeout: 120000 });
          await page.waitForSelector('article.markdown-body', { timeout: 60000 });
          await page.waitForTimeout(5000);
          const h = await page.evaluate(() => document.documentElement.scrollHeight);
          console.log('page height:', h, 'pixels:', 1280 * h);
          await page.screenshot({ path: 'screenshot.png', fullPage: true });
          await browser.close();
          const s = fs.statSync('screenshot.png');
          console.log('screenshot.png bytes:', s.size);
          EOF
          node shot.mjs
          ls -lh screenshot.png
          file screenshot.png
      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshot.png
          git commit -m "Add screenshot.png"
          git push
